<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чат</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header><h1>Чат</h1></header>

  <nav>
    <ul>
      <li><a href="index.html">Поездки</a></li>
      <li><a href="create-trip.html">Создать поездку</a></li>
      <li><a href="search.html">Поиск</a></li>
      <li><a href="chat.html" class="active">Чат</a></li>
      <li><a href="profile.html">Профиль</a></li>
    </ul>
  </nav>

  <main>
    <div class="chat-layout">
      <aside class="chat-list">
        <h3>Мои поездки</h3>
        <div id="chat-list-items"><p class="empty">Загрузка...</p></div>
      </aside>

      <section class="chat-panel">
        <div id="chat-header" class="chat-header">
          <h3>Выберите поездку</h3>
        </div>

        <div class="chat-box" id="chat-box">
          <p class="empty">Выберите поездку слева, чтобы начать переписку</p>
        </div>

        <form id="chat-form" style="display:none">
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Введите сообщение..." required autocomplete="off" />
            <button type="submit">Отправить</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer>© 2026 Сервис попутчиков</footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
