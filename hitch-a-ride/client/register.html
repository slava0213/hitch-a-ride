<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — Попутчики</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;800&display=swap&subset=cyrillic" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="register">
  <main>
    <div class="auth-wrap">
      <form class="panel" id="register-form">
        <h2>Создайте аккаунт 🚀</h2>
        <div id="error" class="message-error" style="display:none"></div>

        <label for="name">Имя</label>
        <input type="text" id="name" autocomplete="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />

        <label for="password">Пароль (минимум 6 символов)</label>
        <input type="password" id="password" minlength="6" autocomplete="new-password" required />

        <button type="submit" class="btn-block">Зарегистрироваться</button>
        <p style="margin:1rem 0 0;text-align:center;color:var(--muted);font-weight:600">
          Уже есть аккаунт? <a href="login.html">Войти</a>
        </p>
      </form>

      <div class="aside-card">
        <h3>Почему стоит присоединиться</h3>
        <ul>
          <li>Регистрация занимает меньше минуты</li>
          <li>Создавайте поездки и принимайте заявки</li>
          <li>Копите рейтинг и доверие попутчиков</li>
          <li>Бесплатно</li>
        </ul>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errBox = document.getElementById('error');
      errBox.style.display = 'none';
      try {
        await Api.post('/register', {
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });
        location.href = 'index.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
