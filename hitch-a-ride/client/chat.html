<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чат — Попутчики</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;800&display=swap&subset=cyrillic" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="chat">
  <main>
    <div class="page-title">
      <h1>Чат</h1>
      <p>Договаривайтесь о месте встречи и деталях поездки.</p>
    </div>

    <div class="chat-layout">
      <aside class="chat-list">
        <h3>Мои поездки</h3>
        <div id="chat-list-items"><div class="empty"><span class="big">⏳</span>Загрузка...</div></div>
      </aside>

      <section class="chat-panel">
        <div id="chat-header" class="chat-header"><h3>Выберите поездку</h3></div>
        <div class="chat-box" id="chat-box">
          <div class="empty"><span class="big">💬</span>Выберите поездку слева, чтобы начать переписку</div>
        </div>
        <form id="chat-form" style="display:none">
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Введите сообщение..." required autocomplete="off" maxlength="2000" />
            <button type="submit">Отправить ➤</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/trips.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
