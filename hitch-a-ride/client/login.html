<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Попутчики</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;800&display=swap&subset=cyrillic" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <main>
    <div class="auth-wrap">
      <form class="panel" id="login-form">
        <h2>С возвращением 👋</h2>
        <div id="error" class="message-error" style="display:none"></div>

        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />

        <label for="password">Пароль</label>
        <input type="password" id="password" autocomplete="current-password" required />

        <button type="submit" class="btn-block">Войти</button>
        <p style="margin:1rem 0 0;text-align:center;color:var(--muted);font-weight:600">
          Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </p>
      </form>

      <div class="aside-card">
        <h3>Что вас ждёт внутри</h3>
        <ul>
          <li>Поездки по всей России</li>
          <li>Чат с водителями и пассажирами</li>
          <li>Рейтинг и честные отзывы</li>
          <li>Экономия на каждой поездке</li>
        </ul>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errBox = document.getElementById('error');
      errBox.style.display = 'none';
      try {
        await Api.post('/login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });
        location.href = 'index.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
